ised representations, pre-trained on 94K hours of unlabeled audio, provide superior features for deepfake audio detection compared to hand-crafted features like MFCCs or CQCCs.",icon:hk},{title:"Multi-Modal Cross-Attention Fusion",description:"Our novel cross-attention fusion mechanism dynamically aligns audio and visual features, enabling the model to detect inconsistencies between modalities that are characteristic of deepfake content.",icon:gk},{title:"Comprehensive Benchmarking",description:"We introduce a new multi-modal deepfake detection benchmark combining audio-only, video-only, and audio-visual deepfakes, providing a more realistic evaluation scenario.",icon:vk},{title:"Open-Source Implementation",description:"We release our complete training pipeline, pre-trained models, and evaluation scripts to facilitate reproducibility and future research in multi-modal deepfake detection.",icon:_E}],xQ=[{q:"Why WavLM over other self-supervised models?",a:"WavLM uses gated relative position bias and denoising objectives during pre-training, making it particularly robust to the acoustic artifacts introduced by speech synthesis and voice conversion systems. Our experiments show 4-6% improvement over Wav2Vec 2.0 and HuBERT on ASVspoof 2019."},{q:"How does the multi-modal fusion improve detection?",a:"Single-modality detectors can be fooled by high-quality deepfakes in that modality. Our cross-attention fusion detects inconsistencies between audio and visual streams — for example, lip movements that don't match the audio, or temporal misalignments — providing an additional signal that's extremely difficult for attackers to circumvent."},{q:"What types of deepfakes can the system detect?",a:"Our system detects: (1) Voice conversion and TTS-based audio deepfakes, (2) Face swap and face reenactment video deepfakes, (3) Lip-sync deepfakes, and (4) Joint audio-visual deepfakes. The multi-modal approach is particularly effective against lip-sync attacks that fool single-modalit
